<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>番茄钟</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
  <!-- 玻璃噪点层 + 顶部高光 -->
  <div class="glass-noise"></div>
  <div class="glass-sheen"></div>

  <!-- 贴边隐藏时的进度条细条（方向由 body.dock-left/right/top/bottom 决定） -->
  <div class="dock-bar"><div class="dock-fill"></div></div>

  <!-- 窗口拖拽区 + 控制按钮 -->
  <header class="titlebar">
    <div class="titlebar-drag">
      <div class="app-title">
        <div class="app-logo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v6M12 2C6 2 3 6 3 9c0 2 1.5 3 3 3 2 0 3-1 3-3 0-2-1-4-2.2-5C8 4.6 9.5 4 12 4"/>
            <path d="M12 2c6 0 9 4 9 7 0 2-1.5 3-3 3-2 0-3-1-3-3 0-2 1-4 2.2-5C16 4.6 14.5 4 12 4"/>
            <path d="M12 4v2"/>
            <path d="M12 8v1"/>
            <path d="M12 22c-4 0-6-2-6-4 0-2 2-3 6-3s6 1 6 3c0 2-2 4-6 4z"/>
          </svg>
        </div>
        <span>番茄钟</span>
      </div>
    </div>
    <div class="titlebar-actions">
      <button class="win-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="win-btn" id="btnPin" title="固定悬浮（置顶）">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5M9 3h6v3l-1.5 3H10.5L9 6V3z"/>
          <path d="M12 6v11"/>
        </svg>
      </button>
      <button class="win-btn" id="btnMin" title="最小化到托盘">
        <svg viewBox="0 0 16 16" width="14" height="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M3 8.5h10" />
        </svg>
      </button>
      <button class="win-btn win-btn-close" id="btnClose" title="关闭">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M3 3l10 10M13 3L3 13" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 阶段 Tab -->
  <nav class="phase-tabs" id="phaseTabs">
    <button class="phase-tab active" data-phase="work">专注</button>
    <button class="phase-tab" data-phase="break">短休</button>
    <button class="phase-tab" data-phase="longBreak">长休</button>
  </nav>

  <!-- 环形计时器 -->
  <main class="timer-area">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220" width="220" height="220">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" />
            <stop offset="100%" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="98" />
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98" />
        <circle class="ring-inner" cx="110" cy="110" r="82" />
      </svg>
      <div class="ring-center" id="ringCenter">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="phase-label" id="phaseLabel">专注时间</div>
        <div class="round-label" id="roundLabel">第 1 轮 · 本轮 1/4</div>
      </div>
    </div>

    <!-- 会话计数圆点 -->
    <div class="round-dots" id="roundDots"></div>

    <!-- 本专注期 agent 活动（Claude Code / OpenCode 等 hook 上报） -->
    <div class="agent-activity" id="agentActivity" hidden></div>
  </main>

  <!-- 控制按钮 -->
  <footer class="controls">
    <div class="controls-row">
      <button class="ctrl-btn" id="btnReset" title="重置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>

      <button class="primary-btn" id="btnStart" title="开始 / 暂停">
        <svg id="iconPlay" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path d="M8 5.5v13l11-6.5-11-6.5z"/>
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" style="display:none">
          <rect x="6" y="5" width="4.5" height="14" rx="1.5"/>
          <rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/>
        </svg>
        <svg id="iconResume" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" style="display:none">
          <path d="M8 5.5v13l11-6.5-11-6.5z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="btnSkip" title="跳过本阶段">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5l10 7-10 7V5z"/>
          <path d="M19 5v14"/>
        </svg>
      </button>
    </div>

    <div class="controls-hint" id="controlsHint">点击开始 · 专注 25 分钟</div>
  </footer>

  <!-- 配置抽屉 -->
  <div class="settings-drawer" id="settingsDrawer">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <span>时长设置</span>
        <button class="drawer-close" id="drawerClose">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
      </div>
      <div class="setting-row">
        <label for="sWork">专注 (分钟)</label>
        <input type="number" id="sWork" min="1" max="120" value="25" />
      </div>
      <div class="setting-row">
        <label for="sBreak">短休 (分钟)</label>
        <input type="number" id="sBreak" min="1" max="60" value="5" />
      </div>
      <div class="setting-row">
        <label for="sLong">长休 (分钟)</label>
        <input type="number" id="sLong" min="1" max="120" value="15" />
      </div>
      <div class="setting-row">
        <label for="sRounds">长休间隔 (轮)</label>
        <input type="number" id="sRounds" min="1" max="8" value="4" />
      </div>
      <div class="setting-row toggle-row">
        <label for="sAuto">自动进入下一阶段</label>
        <label class="switch">
          <input type="checkbox" id="sAuto" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="drawer-divider"></div>
      <div class="drawer-section-title">Agent 集成</div>
      <div class="setting-row toggle-row">
        <label for="sGateway">启用 Agent 网关</label>
        <label class="switch">
          <input type="checkbox" id="sGateway" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row agent-row">
        <span class="agent-meta" id="agentMeta">检测中…</span>
        <select id="agentSelect" class="agent-select" title="选择要生成配置的 agent">
          <option value="zcode">ZCode</option>
          <option value="claude">Claude Code</option>
          <option value="vscode">VS Code Copilot</option>
          <option value="trae">Trae</option>
          <option value="cursor">Cursor</option>
          <option value="opencode">OpenCode</option>
          <option value="codex">Codex CLI</option>
          <option value="qwen">Qwen Code</option>
        </select>
      </div>
      <div class="setting-row agent-row">
        <button class="copy-btn" id="btnCopyHook" title="复制所选 agent 的 hook 配置片段">复制配置</button>
        <button class="copy-btn" id="btnCopyInstall" title="复制一键安装命令（在本机终端执行）">复制安装命令</button>
      </div>

      <button class="drawer-save" id="drawerSave">保存设置</button>
    </div>
  </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
