<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>番茄钟提醒</title>
  <link rel="stylesheet" href="notify.css" />
</head>
<body>
  <div id="notify-card" class="notify-card" data-flavor="agent" data-kind="notification">
    <div class="glass-blob blob-a"></div>
    <div class="glass-blob blob-b"></div>

    <div class="notify-body">
      <div class="notify-content">
        <div class="notify-head" id="notifyHead">
          <span class="notify-kind" id="notifyKind">通知</span>
          <span class="notify-source" id="notifySource" hidden></span>
          <span class="notify-agent" id="notifyAgent" hidden></span>
        </div>

        <!-- 图标不再独占左栏，缩到标题行左侧，正文拿满整宽 -->
        <div class="notify-titlerow">
          <div class="notify-icon-wrap">
            <div class="notify-icon" id="notifyIcon">
              <!-- inline SVG injected -->
            </div>
            <div class="icon-ring" id="iconRing"></div>
          </div>
          <div class="notify-title" id="notifyTitle">时间到</div>
        </div>

        <div class="notify-message" id="notifyMessage"></div>
        <div class="notify-task" id="notifyTask" hidden></div>
        <pre class="notify-detail" id="notifyDetail" hidden></pre>
        <div class="notify-sub" id="notifySub"></div>
      </div>

      <button class="notify-close" id="notifyClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 3l10 10M13 3L3 13" />
        </svg>
      </button>
    </div>

    <!-- 上下文：哪个会话/项目/工具在动（结构化，方便一眼定位） -->
    <div class="notify-context" id="notifyContext" hidden></div>

    <!-- ask：问题列表；permission：备注输入 -->
    <div class="notify-form" id="notifyForm" hidden></div>

    <div class="notify-actions" id="notifyActions" hidden></div>

    <div class="notify-progress"><div class="notify-progress-fill" id="notifyProgress"></div></div>
  </div>

  <script src="notify.js"></script>
</body>
</html>
